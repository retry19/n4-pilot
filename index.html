<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="N4 Pilot — rencana harian menuju JLPT N4 yang jujur: estimasi, gate, dan latihan format ujian."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="N4 Pilot" />
    <title>N4 Pilot — dari nol ke JLPT N4</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <!--app-css-->
    <style>
      /* Boot shell: paints the brand instantly, removed once React mounts. */
      html { background: #faf7f0; }
      html[data-theme='dark'] { background: #0b0f14; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: inherit; color: #1d3557; font-family: system-ui, sans-serif;
      }
      html[data-theme='dark'] #boot { color: #dce6f2; }
      #boot .mark { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; }
      #boot .bar { width: 120px; height: 3px; margin-top: 18px; border-radius: 999px; background: #d7dce1; overflow: hidden; }
      #boot .bar span { display: block; height: 100%; width: 40%; border-radius: 999px; background: #2a4a73; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Lewati ke konten utama</a>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite" aria-label="Memuat N4 Pilot">
      <div style="display: flex; flex-direction: column; align-items: center">
        <div class="mark"><span aria-hidden="true">◈</span> N4 Pilot</div>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        N4 Pilot butuh JavaScript untuk menjalankan sesi belajar. Aktifkan JavaScript lalu muat ulang halaman.
      </p>
    </noscript>
    <!--app-js-->
  </body>
</html>
